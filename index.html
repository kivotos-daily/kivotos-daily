<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基沃托斯日讯-测试版v4.6</title>
    
    <style>
        :root { --bg-color: #121212; --text-main: #e0e0e0; --text-sub: #888888; --accent-color: #ff7b9c; --border-color: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden;}
        
        #error-box { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,0,0,0.95); color: white; padding: 15px; font-weight: bold; z-index: 99999; display: none; font-size: 14px; text-align: center; line-height: 1.5;}
        #toast { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 14px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; display: none; text-align: center; border: 1px solid var(--border-color); font-weight: bold;}
        
        /* 登录页 */
        #auth-page { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; background: #121212; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .auth-box { width: 100%; max-width: 360px; background: #1e1e1e; padding: 30px 20px; border-radius: 16px; border: 1px solid #333; }
        .auth-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 24px; color: var(--accent-color); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
        .auth-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: var(--text-main); font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent-color); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-switch { text-align: center; font-size: 14px; color: #888; margin-top: 20px; cursor: pointer; padding: 15px; border: 1px dashed #444; border-radius: 8px; }
        .auth-switch span { color: var(--accent-color); font-weight: bold; }
        
        /* 主应用 */
        #app { display: none; max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg-color); }
        .header { position: sticky; top: 0; background: rgba(18,18,18,0.85); backdrop-filter: blur(12px); padding: 10px 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; z-index: 100;}
        
        .header-top { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; color: var(--accent-color);}
        .search-box { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 16px; color: var(--text-main); outline: none; font-size: 14px; }
        
        /* 搜索结果下拉 */
        #search-results { position: absolute; top: 100%; left: 0; width: 100%; background: var(--bg-color); border-bottom: 1px solid var(--border-color); z-index: 150; max-height: 300px; overflow-y: auto; display: none;}
        .search-user-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #222; cursor: pointer;}
        .search-user-item:hover { background: #1a1a1a; }

        /* 底部导航 */
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 60px; background: rgba(24,24,24,0.95); border-top: 1px solid var(--border-color); justify-content: space-around; align-items: center; z-index: 200; }
        .bottom-nav.show { display: flex; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-sub); cursor: pointer; flex: 1; position: relative;}
        .nav-item.active { color: var(--accent-color); }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 2px; }
        .nav-btn-add { background: var(--accent-color); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-top: -20px; cursor: pointer; font-size: 24px; }
        .red-dot { position: absolute; top: 5px; right: 25px; width: 8px; height: 8px; background: #ff4757; border-radius: 50%; display: none;}

        /* 公告与标签 */
        .announcement-bar { margin: 12px 16px; background: rgba(255, 123, 156, 0.1); border: 1px solid var(--accent-color); border-radius: 12px; padding: 12px; display: flex; align-items: flex-start; gap: 10px; }
        .role-tag { font-size: 11px; background: rgba(255, 123, 156, 0.2); color: var(--accent-color); padding: 1px 6px; border-radius: 4px; }
        .avatar { border-radius: 50%; background: #333; display: flex; justify-content: center; align-items: center; color: #fff; overflow: hidden; flex-shrink: 0;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* ======== 新版排版 ======== */
        .post-card-new { background: var(--bg-color); padding: 16px; border-bottom: 1px solid var(--border-color); }
        .post-new-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .post-new-user { display: flex; align-items: center; }
        .post-new-user .avatar { width: 40px; height: 40px; margin-right: 10px; }
        .post-new-name { display: flex; flex-direction: column; cursor: pointer;}
        .post-new-name .username { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; color: #fff;}
        .post-new-name .time { font-size: 12px; color: var(--text-sub); }
        .post-content { font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; }
        .post-media { width: 100%; max-height: 300px; border-radius: 16px; margin-bottom: 12px; object-fit: cover; border: 1px solid var(--border-color); }
        
        /* 简约版图标操作栏 */
        .action-bar-new { display: flex; justify-content: space-between; color: var(--text-sub); font-size: 13px; max-width: 380px; }
        .action-icon { display: flex; align-items: center; gap: 4px; cursor: pointer; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .action-icon svg { width: 18px; height: 18px; }
        .action-icon:hover { color: var(--accent-color); }
        .action-icon.active { color: var(--accent-color); stroke: var(--accent-color); }

        /* ======== 怀旧版排版 (图4风格) ======== */
        .post-classic { display: flex; padding: 16px; border-bottom: 1px solid var(--border-color); }
        .post-classic-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; background: #333; cursor: pointer;}
        .post-classic-main { flex: 1; min-width: 0; }
        
        /* 头部：左名字，右时间 */
        .post-classic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .post-classic-name-group { display: flex; align-items: center; gap: 6px; cursor: pointer;}
        .post-classic-name { font-size: 15px; font-weight: bold; color: #fff; }
        .post-classic-time { font-size: 13px; color: #888; }
        
        .post-classic-content { font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; cursor: pointer;}
        .post-classic-media { width: 100%; border-radius: 16px; margin-bottom: 12px; max-height: 300px; object-fit: cover; border: 1px solid var(--border-color); cursor: pointer;}
        
        /* ======== 个人主页 ======== */
        .profile-cover { height: 120px; background: #333 center/cover no-repeat; width: 100%; }
        .profile-info-container { padding: 0 16px 20px; position: relative; }
        .profile-avatar-wrapper { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--bg-color); background: #222; margin-top: -42px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center;}
        .profile-avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .profile-actions-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: -36px; margin-bottom: 16px;}
        .btn-outline { background: transparent; color: #eff3f4; border: 1px solid #536471; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-fill { background: #eff3f4; color: #000; border: none; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;}
        .profile-name { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 2px;}
        .profile-handle { font-size: 15px; color: var(--text-sub); margin-bottom: 12px; }
        .profile-bio { font-size: 15px; margin-bottom: 12px; }
        .profile-stats-row { display: flex; gap: 20px; font-size: 14px; color: var(--text-sub); margin-bottom: 16px;}
        .profile-stats-row b { color: #eff3f4; cursor: pointer;}

        /* 详情页 */
        #detail-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 250; display: none; flex-direction: column; max-width: 500px; margin: 0 auto; left: 50%; transform: translateX(-50%); }
        .detail-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        .back-btn { font-size: 20px; cursor: pointer; margin-right: 20px; color: #fff;}
        .detail-content-area { flex: 1; overflow-y: auto; padding-bottom: 60px; }
        .detail-post-main { padding: 16px; border-bottom: 1px solid var(--border-color); }
        .detail-user-info { display: flex; align-items: center; margin-bottom: 12px;}
        .detail-avatar { width: 48px; height: 48px; border-radius: 50%; margin-right: 12px; overflow: hidden; background: #333;}
        .detail-avatar img { width: 100%; height: 100%; object-fit: cover;}
        .detail-post-content { font-size: 18px; color: #fff; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
        .detail-post-media { width: 100%; border-radius: 16px; margin-bottom: 16px; }
        .detail-bottom-bar { position: absolute; bottom: 0; width: 100%; background: var(--bg-color); border-top: 1px solid var(--border-color); padding: 12px 16px; display: flex; align-items: center; gap: 12px;}
        .detail-input { flex: 1; background: #161616; border: 1px solid var(--border-color); border-radius: 20px; padding: 10px 16px; color: #fff; outline: none;}
        .detail-send-btn { background: var(--accent-color); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;}
        
        /* 评论 */
        .comment-list { padding: 16px; }
        .comment-thread { margin-bottom: 20px;}
        .comment-main { display: flex; gap: 12px; }
        .comment-main .avatar { width: 40px; height: 40px; }
        .comment-main-body { flex: 1; }
        .comment-header { display: flex; align-items: center; gap: 4px; margin-bottom: 4px;}
        .comment-name { font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;}
        .comment-time { font-size: 14px; color: #888; }
        .comment-text { font-size: 15px; color: #eff3f4; margin-bottom: 8px; }
        .comment-actions { display: flex; gap: 20px; font-size: 13px; color: #888; }
        .comment-actions span { cursor: pointer; }
        .comment-replies { margin-left: 20px; padding-left: 20px; border-left: 1px solid var(--border-color); margin-top: 12px; }
        .reply-item { display: flex; gap: 10px; margin-bottom: 12px;}
        .reply-item .avatar { width: 32px; height: 32px; }
        .reply-body { flex: 1; }
        .reply-header { display: flex; align-items: center; gap: 4px; margin-bottom: 2px;}
        .reply-name { font-size: 14px; font-weight: bold; color: #fff; cursor: pointer;}
        .reply-target { font-size: 14px; color: var(--accent-color);}
        .reply-text { font-size: 14px; color: #eff3f4; margin-bottom: 4px;}

        /* 弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 500; display: none; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--bg-color); width: 100%; max-width: 500px; border-radius: 16px 16px 0 0; padding: 20px; display: flex; flex-direction: column; border: 1px solid var(--border-color); border-bottom: none; max-height: 85vh; overflow-y: auto;}
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-weight: bold; font-size: 18px; color: #fff;}
        .modal-textarea { width: 100%; height: 120px; background: transparent; border: none; border-bottom: 1px solid var(--border-color); padding: 12px 0; color: #fff; font-size: 18px; resize: none; outline: none; margin-bottom: 12px; }
        .modal-submit { width: 100%; background: var(--accent-color); color: #fff; border: none; padding: 12px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        
        /* 消息通知列表 */
        .noti-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); gap: 12px; }
        .noti-item .avatar { width: 40px; height: 40px; }
        .noti-content { flex: 1; font-size: 14px; color: #ccc; }
        .noti-content b { color: #fff; }
        .noti-time { font-size: 12px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>

<div id="error-box"></div>
<div id="toast">提示信息</div>

<!-- 登录页 -->
<div id="auth-page">
    <div class="auth-box">
        <div class="auth-title" id="auth-title">基沃托斯日讯-登录</div>
        <div class="input-group" id="nickname-group" style="display: none;">
            <label>昵称</label>
            <input type="text" class="auth-input" id="auth-nickname" placeholder="给自己起个名字">
        </div>
        <div class="input-group">
            <label>邮箱</label>
            <input type="email" class="auth-input" id="auth-email" placeholder="example@mail.com">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" class="auth-input" id="auth-password" placeholder="至少 6 位字符">
        </div>
        <button class="auth-btn" id="submit-btn">登 录</button>
        <div class="auth-switch" id="switch-btn">
            还没有账号？<span id="switch-text">立即注册</span>
        </div>
    </div>
</div>

<!-- 主应用 -->
<div id="app">
    <header class="header">
        <div class="header-top">
            <span id="header-title">首页</span>
            <span style="font-size: 12px; color: var(--text-sub); cursor:pointer;" id="layout-btn" onclick="toggleLayout()">切怀旧版</span>
        </div>
        <input type="text" class="search-box" id="search-input" placeholder="搜索帖子或用户..." oninput="handleSearch(this.value)">
        <div id="search-results"></div>
    </header>
    
    <main id="main-content"></main>
    
    <nav class="bottom-nav" id="bottom-nav">
        <div class="nav-item active" data-view="feed" onclick="switchView('feed')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>首页
        </div>
        <div class="nav-item" data-view="story" onclick="switchView('story')">
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>剧情
        </div>
        <div class="nav-btn-add" onclick="openPostModal()">+</div>
        <div class="nav-item" data-view="notifications" onclick="switchView('notifications')">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            消息
            <div class="red-dot" id="noti-dot"></div>
        </div>
        <div class="nav-item" data-view="profile_self" onclick="switchView('profile_self')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>我的
        </div>
    </nav>
</div>

<!-- 详情页 -->
<div id="detail-page">
    <div class="detail-header">
        <div class="back-btn" onclick="closeDetailPage()">←</div>
        <div class="detail-header-title">帖子详情</div>
    </div>
    <div class="detail-content-area" id="detail-render-area"></div>
    <div class="detail-bottom-bar">
        <input type="text" class="detail-input" id="comment-input" placeholder="发布你的评论...">
        <button class="detail-send-btn" onclick="submitComment()">回复</button>
    </div>
</div>

<!-- 发帖弹窗 -->
<div class="modal-overlay" id="post-modal">
    <div class="modal-content">
        <div class="modal-header"><span>发布新帖子</span><span style="cursor:pointer;" onclick="closePostModal()">✕</span></div>
        <div class="mode-switch" style="display:flex; gap:10px; margin-bottom:12px;">
            <div class="mode-btn active" id="mode-normal" onclick="switchPostMode('normal')" style="flex:1; text-align:center; padding:8px; border-radius:20px; border:1px solid #333; cursor:pointer; background:#222; color:#fff;">日常发帖</div>
            <div class="mode-btn" id="mode-cos" onclick="switchPostMode('cosplay')" style="flex:1; text-align:center; padding:8px; border-radius:20px; border:1px solid #333; cursor:pointer; background:transparent; color:#888;">🎭 剧情演绎</div>
        </div>
        <div class="role-input-group" id="role-input-group" style="display:none; margin-bottom:12px;">
            <input type="text" class="auth-input" id="post-role" placeholder="扮演角色（如：砂狼白子）" style="margin-bottom: 10px;">
        </div>
        <textarea class="modal-textarea" id="post-input" placeholder="有什么新鲜事？"></textarea>
        <div class="input-group" style="margin-top:10px;">
            <label>附带图片/视频链接 (可选)</label>
            <input type="text" class="auth-input" id="post-media-url" placeholder="https://...">
        </div>
        <button class="modal-submit" onclick="submitPost()">发布</button>
    </div>
</div>

<!-- 通用列表弹窗 (粉丝/关注) -->
<div class="modal-overlay" id="list-modal">
    <div class="modal-content" style="height: 60vh;">
        <div class="modal-header"><span id="list-title">列表</span><span style="cursor:pointer;" onclick="document.getElementById('list-modal').style.display='none'">✕</span></div>
        <div id="list-render-area" style="flex:1; overflow-y:auto;"></div>
    </div>
</div>

<script>
    // ==========================================
    // 👇👇👇 填入你的 Netlify 代理网址 👇👇👇
    // ==========================================
    const SUPABASE_URL = 'https://kivotos-daily.netlify.app'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_SS8mq5Lp308vHP-e6rLtlw_hq1GILut'; 
    
    let supabaseClient = null;
    let CurrentUserProfile = null;
    let AllPosts = []; 
    let AllUsers = []; 
    let isRegisterMode = false;
    let currentView = 'feed';
    let viewingUserId = null;
    let currentPostMode = 'normal';
    let currentPostIdForComment = null;
    let currentReplyTo = null;
    let currentLayout = localStorage.getItem('forum_layout') || 'new';
    let isLoggingIn = false;
    let unreadNotiCount = 0;

    function generateSignal() { return `KIV-${Math.floor(100000 + Math.random() * 900000)}`; }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg; 
        toast.style.display = 'block';
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('submit-btn').onclick = async function() {
            if (isLoggingIn) return;
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value.trim();
            const btn = document.getElementById('submit-btn');
            if (!email || !password) return showToast('请填写邮箱和密码');
            if (password.length < 6) return showToast('密码至少需要6位');
            if (isRegisterMode && !nickname) return showToast('请输入昵称');
            isLoggingIn = true; btn.innerText = '处理中...'; btn.disabled = true;
            try {
                if (isRegisterMode) {
                    const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { display_name: nickname } } });
                    if (error) throw error;
                    if (data.user) {
                        await supabaseClient.from('profiles').insert([{ id: data.user.id, name: nickname, email: email, signal: generateSignal(), avatar: `https://api.dicebear.com/7.x/adventurer/svg?seed=${nickname}`, bio: '' }]);
                        showToast('注册成功！请登录。');
                        document.getElementById('switch-btn').click();
                    }
                } else {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    await initUser(data.user);
                }
            } catch (err) { showToast('操作失败：' + err.message); } 
            finally { isLoggingIn = false; btn.innerText = isRegisterMode ? '注 册' : '登 录'; btn.disabled = false; }
        };
    });

    function initApp() {
        if (typeof supabase === 'undefined') return;
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('switch-btn').onclick = function() {
            if (isLoggingIn) return;
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? '基沃托斯日讯-注册' : '基沃托斯日讯-登录';
            document.getElementById('submit-btn').innerText = isRegisterMode ? '注 册' : '登 录';
            document.getElementById('switch-text').innerText = isRegisterMode ? '去登录' : '立即注册';
            document.getElementById('nickname-group').style.display = isRegisterMode ? 'block' : 'none';
        };
        checkAuth();
    }

    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            await initUser(session.user);
        } else {
            document.getElementById('auth-page').style.display = 'flex'; 
            document.getElementById('app').style.display = 'none';
        }
    }

    async function initUser(user) {
        let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
        if (!profile) return;
        CurrentUserProfile = profile;
        localStorage.setItem('cached_profile', JSON.stringify(profile));
        
        document.getElementById('auth-page').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        
        let { data: users } = await supabaseClient.from('profiles').select('*');
        AllUsers = users || [];
        
        await loadNotifications();
        await resetAndLoadPosts();
    }

    window.logout = async function() {
        await supabaseClient.auth.signOut();
        CurrentUserProfile = null;
        localStorage.clear();
        location.reload();
    }

    async function resetAndLoadPosts() {
        const { data: posts } = await supabaseClient.from('posts').select(`*, profiles ( name, avatar, signal, email )`).order('created_at', { ascending: false }).limit(50);
        AllPosts = posts || [];
        render();
    }

    async function loadNotifications() {
        const { data: notis } = await supabaseClient.from('notifications').select('*, sender:profiles!sender_id(name, avatar)').eq('user_id', CurrentUserProfile.id).order('created_at', { ascending: false });
        window.UserNotifications = notis || [];
        unreadNotiCount = window.UserNotifications.filter(n => !n.is_read).length;
        document.getElementById('noti-dot').style.display = unreadNotiCount > 0 ? 'block' : 'none';
    }

    window.handleSearch = function(val) {
        const resBox = document.getElementById('search-results');
        if (!val) { resBox.style.display = 'none'; return; }
        
        const matchedUsers = AllUsers.filter(u => u.name.includes(val));
        if (matchedUsers.length > 0) {
            let html = '';
            matchedUsers.forEach(u => {
                html += `
                <div class="search-user-item" onclick="viewUser('${u.id}')">
                    <div class="avatar" style="width:40px;height:40px;background:${u.avatarColor || '#333'};margin-right:12px;"><img src="${u.avatar}"></div>
                    <div style="font-weight:bold;color:#fff;">${u.name}</div>
                </div>`;
            });
            resBox.innerHTML = html;
            resBox.style.display = 'block';
        } else {
            resBox.style.display = 'none';
        }
    }

    window.switchView = function(viewName, targetId = null) {
        currentView = viewName;
        document.getElementById('search-input').value = '';
        document.getElementById('search-results').style.display = 'none';
        
        if (viewName === 'profile_other') {
            viewingUserId = targetId;
        }
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (viewName !== 'profile_other') {
            const navBtn = document.querySelector(`.nav-item[data-view="${viewName}"]`);
            if(navBtn) navBtn.classList.add('active');
        }
        render();
    }

    window.viewUser = function(id) {
        if (id === CurrentUserProfile.id) switchView('profile_self');
        else switchView('profile_other', id);
    }

    function render() {
        if (!CurrentUserProfile) return;
        
        const headerTitle = document.getElementById('header-title');
        let html = '';
        let postsToRender = AllPosts;

        if (currentView === 'feed') {
            headerTitle.innerText = '首页';
            html += `<div class="announcement-bar"><div class="announcement-icon">📢</div><div class="announcement-content">基沃托斯日讯 v4.6 已上线！</div></div>`;
        } 
        else if (currentView === 'story') {
            headerTitle.innerText = '剧情广场';
            postsToRender = postsToRender.filter(p => p.type === 'cosplay');
        } 
        else if (currentView === 'notifications') {
            headerTitle.innerText = '消息';
            if (window.UserNotifications.length === 0) {
                html += `<div style="text-align:center;padding:50px;color:#666;">暂无新消息</div>`;
            } else {
                window.UserNotifications.forEach(n => {
                    let actionText = n.type === 'like' ? '赞了你的帖子' : (n.type === 'follow' ? '关注了你' : '评论了你的帖子');
                    html += `
                    <div class="noti-item" onclick="viewUser('${n.sender_id}')">
                        <div class="avatar"><img src="${n.sender?.avatar}"></div>
                        <div class="noti-content">
                            <b>${n.sender?.name || '某人'}</b> ${actionText}
                            <div class="noti-time">${new Date(n.created_at).toLocaleString()}</div>
                        </div>
                    </div>`;
                });
            }
        } 
        else if (currentView === 'profile_self' || currentView === 'profile_other') {
            const isSelf = currentView === 'profile_self';
            const targetUser = isSelf ? CurrentUserProfile : AllUsers.find(u => u.id === viewingUserId);
            if (!targetUser) return;
            
            headerTitle.innerText = isSelf ? '我的主页' : '用户主页';
            postsToRender = postsToRender.filter(p => p.author_id === targetUser.id);

            const followersList = AllUsers.filter(u => u.following_list && u.following_list.includes(targetUser.id));
            const followingCount = targetUser.following_list ? targetUser.following_list.length : 0;
            const isFollowed = CurrentUserProfile.following_list && CurrentUserProfile.following_list.includes(targetUser.id);

            html += `
            <div class="profile-cover" style="background-image:url('${targetUser.cover || ''}')"></div>
            <div class="profile-info-container">
                <div class="profile-avatar-wrapper"><img src="${targetUser.avatar}"></div>
                <div class="profile-actions-row">
                    ${isSelf ? `<button class="btn-outline" onclick="logout()">退出登录</button>` : 
                    `<button class="${isFollowed ? 'btn-outline' : 'btn-fill'}" onclick="toggleFollow('${targetUser.id}')">${isFollowed ? '已关注' : '关注'}</button>`}
                </div>
                <div class="profile-name">${targetUser.name}</div>
                <div class="profile-handle">@${targetUser.signal}</div>
                <div class="profile-bio">${targetUser.bio || '这个人很神秘。'}</div>
                <div class="profile-stats-row">
                    <span onclick="showUserList('following', '${targetUser.id}')"><b>${followingCount}</b> 关注</span>
                    <span onclick="showUserList('followers', '${targetUser.id}')"><b>${followersList.length}</b> 粉丝</span>
                </div>
            </div>`;
        }

        if (currentView !== 'notifications') {
            postsToRender.sort((a, b) => b.created_at - a.created_at);
            if (postsToRender.length === 0 && currentView !== 'feed') {
                html += `<div style="text-align:center;padding:50px;color:#666;">这里空空如也~</div>`;
            } else {
                postsToRender.forEach(post => { html += renderPostHTML(post); });
            }
        }
        
        document.getElementById('main-content').innerHTML = html;
    }

    function renderPostHTML(post) {
        const authorProfile = post.profiles || { name: '未知', avatar: '', email: '' };
        const isLiked = post.isLiked || false;
        const isBookmarked = CurrentUserProfile.bookmarks?.includes(post.id);
        
        let mediaHtml = '';
        if (post.media_data) {
            if (post.media_type === 'image') mediaHtml = `<img src="${post.media_data}" class="${currentLayout === 'new' ? 'post-media' : 'post-classic-media'}" loading="lazy">`;
            else if (post.media_type === 'video') mediaHtml = `<video src="${post.media_data}" class="${currentLayout === 'new' ? 'post-media' : 'post-classic-media'}" controls></video>`;
        }

        // 简约图标集
        const iconReply = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>`;
        const iconRetweet = `<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>`;
        const iconHeart = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
        const iconHeartFill = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
        const iconViews = `<svg viewBox="0 0 24 24"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>`;
        const iconBookmark = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;
        const iconBookmarkFill = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>`;

        if (currentLayout === 'new') {
            return `
            <div class="post-card-new">
                <div class="post-new-header" onclick="openDetailPage('${post.id}')">
                    <div class="post-new-user">
                        <div class="avatar" onclick="event.stopPropagation(); viewUser('${post.author_id}')" style="background: ${authorProfile.avatarColor || '#333'}">
                            <img src="${authorProfile.avatar}">
                        </div>
                        <div class="post-new-name" onclick="event.stopPropagation(); viewUser('${post.author_id}')">
                            <span class="username">${authorProfile.name}${post.type === 'cosplay' ? `<span class="role-tag">${post.role}</span>` : ''}</span>
                            <span class="time">${new Date(post.created_at).toLocaleString()}</span>
                        </div>
                    </div>
                </div>
                <div onclick="openDetailPage('${post.id}')">
                    <div class="post-content">${post.content}</div>
                    ${mediaHtml}
                </div>
                
                <!-- 新版简约操作栏 -->
                <div class="action-bar-new">
                    <div class="action-icon" onclick="openDetailPage('${post.id}')">${iconReply} <span>${(post.comments || []).length}</span></div>
                    <div class="action-icon">${iconRetweet} <span>0</span></div>
                    <div class="action-icon ${post.isLiked ? 'active' : ''}" onclick="toggleLike('${post.id}')">${post.isLiked ? iconHeartFill : iconHeart} <span>${post.likes}</span></div>
                    <div class="action-icon">${iconViews} <span>${post.views}</span></div>
                    <div class="action-icon ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${post.id}')">${isBookmarked ? iconBookmarkFill : iconBookmark}</div>
                </div>
            </div>`;
        } else {
            // 怀旧版排版 (完美复刻图4)
            return `
            <div class="post-classic">
                <div class="post-classic-avatar avatar" onclick="viewUser('${post.author_id}')">
                    <img src="${authorProfile.avatar}">
                </div>
                <div class="post-classic-main">
                    <!-- 头部：左名字，右时间 -->
                    <div class="post-classic-header">
                        <div class="post-classic-name-group" onclick="viewUser('${post.author_id}')">
                            <span class="post-classic-name">${authorProfile.name}</span>
                            ${post.type === 'cosplay' ? `<span class="role-tag">${post.role}</span>` : ''}
                        </div>
                        <span class="post-classic-time">· ${new Date(post.created_at).toLocaleString()}</span>
                    </div>
                    
                    <!-- 内容点击进详情 -->
                    <div class="post-classic-content" onclick="openDetailPage('${post.id}')">${post.content}</div>
                    <div onclick="openDetailPage('${post.id}')">${mediaHtml}</div>
                    
                    <!-- 底部操作栏 -->
                    <div class="action-bar-new" style="margin-top:12px;">
                        <div class="action-icon" onclick="openDetailPage('${post.id}')">${iconReply} <span>${(post.comments || []).length}</span></div>
                        <div class="action-icon">${iconRetweet} <span>0</span></div>
                        <div class="action-icon ${post.isLiked ? 'active' : ''}" onclick="toggleLike('${post.id}')">${post.isLiked ? iconHeartFill : iconHeart} <span>${post.likes}</span></div>
                        <div class="action-icon">${iconViews} <span>${post.views}</span></div>
                        <div class="action-icon ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${post.id}')">${isBookmarked ? iconBookmarkFill : iconBookmark}</div>
                        <div class="action-icon"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg></div>
                    </div>
                </div>
            </div>`;
        }
    }

    window.showUserList = function(type, userId) {
        const targetUser = AllUsers.find(u => u.id === userId);
        if (!targetUser) return;
        
        let list = [];
        if (type === 'following') {
            list = AllUsers.filter(u => targetUser.following_list && targetUser.following_list.includes(u.id));
            document.getElementById('list-title').innerText = '关注列表';
        } else {
            list = AllUsers.filter(u => u.following_list && u.following_list.includes(targetUser.id));
            document.getElementById('list-title').innerText = '粉丝列表';
        }

        let html = '';
        if (list.length === 0) html = `<div style="text-align:center;padding:40px;color:#666;">空空如也</div>`;
        else {
            list.forEach(u => {
                html += `
                <div class="search-user-item" onclick="document.getElementById('list-modal').style.display='none'; viewUser('${u.id}')">
                    <div class="avatar" style="width:40px;height:40px;margin-right:12px;"><img src="${u.avatar}"></div>
                    <div style="font-weight:bold;color:#fff;">${u.name}</div>
                </div>`;
            });
        }
        document.getElementById('list-render-area').innerHTML = html;
        document.getElementById('list-modal').style.display = 'flex';
    }

    window.openDetailPage = async function(id) {
        currentPostIdForComment = id;
        currentReplyTo = null;
        const post = AllPosts.find(x => x.id === id);
        if (!post) return;

        document.getElementById('detail-render-area').innerHTML = `<div style="text-align:center; padding:50px; color:#888;">拉取评论中...</div>`;
        document.getElementById('detail-page').style.display = 'flex';
        
        post.views = (post.views || 0) + 1;
        supabaseClient.from('posts').update({ views: post.views }).eq('id', id).then();

        const { data: comments } = await supabaseClient.from('comments').select(`*, profiles ( name, avatar, signal )`).eq('post_id', id).order('created_at', { ascending: true });

        const authorProfile = post.profiles || { name: '未知', avatar: '' };
        let mediaHtml = post.media_data ? (post.media_type === 'image' ? `<img src="${post.media_data}" class="detail-post-media">` : `<video src="${post.media_data}" class="detail-post-media" controls></video>`) : '';
        
        let html = `<div class="detail-post-main">
            <div class="detail-user-info">
                <div class="detail-avatar" onclick="closeDetailPage(); viewUser('${post.author_id}')"><img src="${authorProfile.avatar}"></div>
                <div>
                    <div class="comment-name" onclick="closeDetailPage(); viewUser('${post.author_id}')">${authorProfile.name}</div>
                    <div class="comment-time">@${authorProfile.signal}</div>
                </div>
            </div>
            <div class="detail-post-content">${post.content}</div>
            ${mediaHtml}
        </div>`;

        html += `<div class="comment-list">`;
        if (!comments || comments.length === 0) html += `<div style="text-align:center; padding:20px; color:#666;">还没有评论</div>`;
        else {
            let rootComments = comments.filter(c => !c.reply_to);
            rootComments.forEach(root => {
                const rootAuthor = root.profiles || { name: '未知', avatar: '' };
                const replies = comments.filter(c => c.reply_to === root.author_id);
                
                html += `<div class="comment-thread">
                    <div class="comment-main">
                        <div class="avatar" onclick="closeDetailPage(); viewUser('${root.author_id}')"><img src="${rootAuthor.avatar}"></div>
                        <div class="comment-main-body">
                            <div class="comment-header"><span class="comment-name" onclick="closeDetailPage(); viewUser('${root.author_id}')">${rootAuthor.name}</span></div>
                            <div class="comment-text">${root.content}</div>
                            <div class="comment-actions"><span onclick="prepareReply('${rootAuthor.name}', '${root.author_id}')">💬 回复</span></div>
                        </div>
                    </div>`;
                if (replies.length > 0) {
                    html += `<div class="comment-replies">`;
                    replies.forEach(reply => {
                        const replyAuthor = reply.profiles || { name: '未知', avatar: '' };
                        html += `<div class="reply-item">
                            <div class="avatar" onclick="closeDetailPage(); viewUser('${reply.author_id}')"><img src="${replyAuthor.avatar}"></div>
                            <div class="reply-body">
                                <div class="reply-header"><span class="reply-name" onclick="closeDetailPage(); viewUser('${reply.author_id}')">${replyAuthor.name}</span></div>
                                <div class="reply-text"><span class="reply-target">回复：</span>${reply.content}</div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });
        }
        html += `</div>`;
        
        document.getElementById('detail-render-area').innerHTML = html;
        document.getElementById('comment-input').value = '';
    }

    window.closeDetailPage = function() { document.getElementById('detail-page').style.display = 'none'; render(); }
    window.prepareReply = function(name, id) { currentReplyTo = id; const input = document.getElementById('comment-input'); input.placeholder = `回复 @${name}...`; input.focus(); }

    window.submitComment = async function() {
        const input = document.getElementById('comment-input');
        const c = input.value.trim(); if (!c) return;
        
        await supabaseClient.from('comments').insert([{ post_id: currentPostIdForComment, author_id: CurrentUserProfile.id, content: c, reply_to: currentReplyTo }]);
        
        const post = AllPosts.find(x => x.id === currentPostIdForComment);
        if(post && post.author_id !== CurrentUserProfile.id) {
            await supabaseClient.from('notifications').insert([{ user_id: post.author_id, sender_id: CurrentUserProfile.id, type: 'comment', content: c, post_id: post.id }]);
        }

        input.value = ''; currentReplyTo = null;
        openDetailPage(currentPostIdForComment); 
    }

    // 修复：更新点赞状态到云端
    window.toggleLike = async function(id) {
        const post = AllPosts.find(x => x.id === id);
        if (!post) return;
        post.isLiked = !post.isLiked;
        post.likes += post.isLiked ? 1 : -1;
        
        if(post.isLiked && post.author_id !== CurrentUserProfile.id) {
            await supabaseClient.from('notifications').insert([{ user_id: post.author_id, sender_id: CurrentUserProfile.id, type: 'like', post_id: post.id }]);
        }
        
        render();
    }

    // 修复：更新收藏状态到云端
    window.toggleBookmark = async function(id) {
        if (!CurrentUserProfile.bookmarks) CurrentUserProfile.bookmarks = [];
        const idx = CurrentUserProfile.bookmarks.indexOf(id);
        if (idx > -1) CurrentUserProfile.bookmarks.splice(idx, 1);
        else CurrentUserProfile.bookmarks.push(id);
        
        // 同步到 Supabase
        await supabaseClient.from('profiles').update({ bookmarks: CurrentUserProfile.bookmarks }).eq('id', CurrentUserProfile.id);
        
        let userInAll = AllUsers.find(u => u.id === CurrentUserProfile.id);
        if(userInAll) userInAll.bookmarks = CurrentUserProfile.bookmarks;
        render();
    }

    // 修复：更新关注状态到云端
    window.toggleFollow = async function(targetId) {
        const targetUser = AllUsers.find(u => u.id === targetId);
        if (!targetUser) return;
        
        let fList = CurrentUserProfile.following_list || [];
        const idx = fList.indexOf(targetId);

        if (idx > -1) {
            fList.splice(idx, 1);
            targetUser.followers = Math.max(0, (targetUser.followers || 0) - 1);
        } else {
            fList.push(targetId);
            targetUser.followers = (targetUser.followers || 0) + 1;
            await supabaseClient.from('notifications').insert([{ user_id: targetId, sender_id: CurrentUserProfile.id, type: 'follow' }]);
        }
        
        CurrentUserProfile.following_list = fList;
        
        // 同步到 Supabase (双向更新)
        await supabaseClient.from('profiles').update({ following_list: fList }).eq('id', CurrentUserProfile.id);
        await supabaseClient.from('profiles').update({ followers: targetUser.followers }).eq('id', targetId);
        
        render();
    }

    window.openPostModal = function() { 
        document.getElementById('post-input').value = ''; 
        document.getElementById('post-role').value = ''; 
        document.getElementById('post-media-url').value = '';
        switchPostMode('normal'); 
        document.getElementById('post-modal').style.display = 'flex'; 
    }
    window.closePostModal = function() { document.getElementById('post-modal').style.display = 'none'; }
    window.switchPostMode = function(mode) {
        currentPostMode = mode;
        document.getElementById('mode-normal').style.background = mode === 'normal' ? '#222' : 'transparent';
        document.getElementById('mode-normal').style.color = mode === 'normal' ? '#fff' : '#888';
        document.getElementById('mode-cos').style.background = mode === 'cosplay' ? '#222' : 'transparent';
        document.getElementById('mode-cos').style.color = mode === 'cosplay' ? '#fff' : '#888';
        document.getElementById('role-input-group').style.display = mode === 'cosplay' ? 'block' : 'none';
    }

    window.submitPost = async function() {
        const c = document.getElementById('post-input').value.trim();
        const role = document.getElementById('post-role').value.trim();
        const mediaUrl = document.getElementById('post-media-url').value.trim();
        
        if (!c) return showToast('内容不能为空');
        if (currentPostMode === 'cosplay' && !role) return showToast('请填写角色名');

        await supabaseClient.from('posts').insert([{
            author_id: CurrentUserProfile.id, content: c, type: currentPostMode, role: currentPostMode === 'cosplay' ? role : null, media_type: mediaUrl ? 'image' : null, media_data: mediaUrl || null
        }]);

        closePostModal(); 
        await resetAndLoadPosts(); 
        switchView(currentPostMode === 'cosplay' ? 'story' : 'feed'); 
    }

    window.toggleLayout = function() {
        currentLayout = currentLayout === 'new' ? 'classic' : 'new';
        localStorage.setItem('forum_layout', currentLayout);
        document.getElementById('layout-btn').innerText = currentLayout === 'new' ? '切怀旧版' : '切普通版';
        render(); 
    }
</script>
</body>
</html>
