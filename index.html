<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基沃托斯日讯-测试版v2.9</title>
    
    <script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.39.7/supabase.min.js"></script>

    <style>
        :root { --bg-color: #121212; --text-main: #e0e0e0; --accent-color: #ff7b9c; --border-color: #333333; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden;}
        
        /* 报错展示区 */
        #error-box { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,0,0,0.9); color: white; padding: 15px; font-weight: bold; z-index: 99999; display: none; font-size: 14px; line-height: 1.4; word-break: break-all;}

        #auth-page { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; background: #121212; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .auth-box { width: 100%; max-width: 360px; background: #1e1e1e; padding: 30px 20px; border-radius: 16px; border: 1px solid #333; }
        .auth-title { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 24px; color: var(--accent-color); }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
        .auth-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #121212; color: var(--text-main); font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent-color); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-btn:disabled { opacity: 0.6; }
        .auth-switch { text-align: center; font-size: 14px; color: #888; margin-top: 20px; cursor: pointer; padding: 15px; border: 1px dashed #444; border-radius: 8px; }
        .auth-switch span { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

<!-- 报错框 -->
<div id="error-box"></div>

<!-- 登录页 -->
<div id="auth-page">
    <div class="auth-box">
        <div class="auth-title" id="auth-title">基沃托斯日讯-登录</div>
        <div class="input-group" id="nickname-group" style="display: none;">
            <label>昵称</label>
            <input type="text" class="auth-input" id="auth-nickname" placeholder="给自己起个名字">
        </div>
        <div class="input-group">
            <label>邮箱</label>
            <input type="email" class="auth-input" id="auth-email" placeholder="example@mail.com">
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" class="auth-input" id="auth-password" placeholder="至少 6 位字符">
        </div>
        <button class="auth-btn" id="submit-btn">登 录</button>
        
        <!-- 这里加粗了虚线框，方便你点击 -->
        <div class="auth-switch" id="switch-btn">
            还没有账号？<span id="switch-text">立即注册</span>
        </div>
    </div>
</div>

<script>
    // 【防撞墙】捕获所有代码报错并显示在屏幕上
    window.onerror = function(msg, url, line) {
        var errBox = document.getElementById('error-box');
        errBox.style.display = 'block';
        errBox.innerHTML += "⚠️ 代码报错: " + msg + " (第" + line + "行)<br>";
        return false;
    };

    // 填入你的配置
    const SUPABASE_URL = 'https://ycjshhxxqnyizewpswoc.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_SS8mq5Lp308vHP-e6rLtlw_hq1GILut'; 
    let supabaseClient = null;

    try {
        if (typeof supabase !== 'undefined') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            throw new Error("Supabase 库未加载成功，可能被网络拦截");
        }
    } catch(e) {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').innerText = "❌ 初始化失败：" + e.message;
    }

    let isRegisterMode = false;
    let isLoggingIn = false;

    // 等页面加载完毕后，再绑定点击事件（绝对不会点不动）
    document.addEventListener("DOMContentLoaded", function() {
        
        // 1. 切换登录/注册按钮
        document.getElementById('switch-btn').onclick = function() {
            if (isLoggingIn) return;
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? '基沃托斯日讯-注册' : '基沃托斯日讯-登录';
            document.getElementById('submit-btn').innerText = isRegisterMode ? '注 册' : '登 录';
            document.getElementById('switch-text').innerText = isRegisterMode ? '去登录' : '立即注册';
            document.getElementById('nickname-group').style.display = isRegisterMode ? 'block' : 'none';
        };

        // 2. 登录/注册提交按钮
        document.getElementById('submit-btn').onclick = async function() {
            if (isLoggingIn) return;
            if (!supabaseClient) {
                alert("网络组件加载失败，请检查网络后刷新");
                return;
            }

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!email || !password) return alert('请填写邮箱和密码');
            if (password.length < 6) return alert('密码至少需要6位');
            if (isRegisterMode && !nickname) return alert('请输入昵称');

            isLoggingIn = true;
            const originalText = btn.innerText;
            btn.innerText = '网络连接中...';
            btn.disabled = true;

            // 12秒超时保护
            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error('网络连接超时！请切换WiFi/流量再试')), 12000)
            );

            try {
                if (isRegisterMode) {
                    const { data, error } = await Promise.race([
                        supabaseClient.auth.signUp({ email, password, options: { data: { display_name: nickname } } }),
                        timeoutPromise
                    ]);
                    if (error) throw error;
                    
                    if (data.user) {
                        await Promise.race([
                            supabaseClient.from('profiles').insert([{
                                id: data.user.id, name: nickname, email: email, signal: `KIV-${Math.floor(100000 + Math.random() * 900000)}`, 
                                avatar: `https://api.dicebear.com/7.x/adventurer/svg?seed=${nickname}`, bio: ''
                            }]),
                            timeoutPromise
                        ]);
                        alert('注册成功！请点击下方按钮登录。');
                        document.getElementById('switch-btn').click(); // 自动切回登录
                    }
                } else {
                    const { data, error } = await Promise.race([
                        supabaseClient.auth.signInWithPassword({ email, password }),
                        timeoutPromise
                    ]);
                    if (error) throw error;
                    
                    alert('登录成功！由于这是测试页，我确认按钮能点、且能连上服务器就行了。完整的主界面代码随时可以加上。');
                }
            } catch (err) { 
                if (err.message.includes('Email not confirmed')) {
                    alert('账号未激活！请去 Supabase 后台删除该账号，或换邮箱重新注册。');
                } else {
                    alert('操作失败：' + err.message); 
                }
            } finally { 
                isLoggingIn = false;
                btn.innerText = originalText; 
                btn.disabled = false; 
            }
        };
    });
</script>
</body>
</html>
