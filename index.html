<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极限排查</title>
    <style>
        body { background: #121212; color: white; text-align: center; padding-top: 40px; font-family: sans-serif; }
        .box { margin: 20px auto; padding: 20px; border-radius: 10px; width: 80%; max-width: 400px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>网络脚本加载测试</h1>
    <div id="result1" class="box" style="background: #555;">测试 1: 国外 CDN ...</div>
    <div id="result2" class="box" style="background: #555;">测试 2: 国内 CDN ...</div>

    <!-- 测试国外服务器 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <!-- 测试国内服务器 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script>
        setTimeout(() => {
            if (typeof jQuery !== 'undefined') {
                document.getElementById('result1').style.background = 'green';
                document.getElementById('result1').innerText = '✅ 国外 CDN 成功加载！';
            } else {
                document.getElementById('result1').style.background = 'red';
                document.getElementById('result1').innerText = '❌ 国外 CDN 被拦截/超时！';
            }
        }, 1500);
        
        // 因为国内加载快，如果加载出来了，肯定就成功
        if (typeof jQuery !== 'undefined') {
             document.getElementById('result2').style.background = 'green';
             document.getElementById('result2').innerText = '✅ 国内 CDN 成功加载！';
        } else {
             // 稍微等一会儿
             setTimeout(() => {
                 if (typeof jQuery === 'undefined') {
                     document.getElementById('result2').style.background = 'red';
                     document.getElementById('result2').innerText = '❌ 国内 CDN 也被拦截了！';
                 }
             }, 1500);
        }
    </script>
</body>
</html>
