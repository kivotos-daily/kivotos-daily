<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击测试</title>
    <style>
        body { background: #121212; color: white; padding: 20px; text-align: center; font-family: sans-serif; }
        .box { border: 2px solid #ff7b9c; padding: 20px; border-radius: 10px; margin-top: 50px;}
        button { padding: 15px; width: 100%; font-size: 18px; background: #ff7b9c; color: white; border: none; border-radius: 8px; margin-top: 20px;}
    </style>
</head>
<body>
    <h1>按钮防卡死测试</h1>
    <div class="box">
        <p>请点击下面的按钮，看看会不会弹窗：</p>
        <button onclick="alert('按钮能点动！网页没有死机！')">点击我测试</button>
    </div>
</body>
</html>
